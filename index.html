<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NextWatch – Anime Picks</title>
<style>
:root{--navy:#1b365d;--blue:#055699;--sky:#63c0e4;--ice:#9fdff0;--text:#eef9fd;--muted:#b7d6e6;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(135deg,var(--navy),var(--blue) 60%,var(--navy));background-attachment:fixed;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;z-index:0;pointer-events:none;will-change:transform}
.o1{width:420px;height:420px;background:radial-gradient(circle,rgba(99,192,228,.65),transparent 70%);top:-140px;right:-140px;animation:fl 14s ease-in-out infinite}
.o2{width:380px;height:380px;background:radial-gradient(circle,rgba(159,223,240,.4),transparent 70%);bottom:-140px;left:-120px;animation:fl 17s ease-in-out infinite reverse}
.o3{width:300px;height:300px;background:radial-gradient(circle,rgba(5,86,153,.8),transparent 70%);top:40%;left:50%;animation:fl 12s ease-in-out infinite}
@keyframes fl{50%{transform:translate(40px,-50px) scale(1.15)}}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:22px 14px 50px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px rgba(0,10,30,.25)}
.blur{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;position:relative;overflow:hidden}
nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;margin-bottom:16px}
.logo{font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;font-size:clamp(.9rem,4vw,1.1rem)}
.logo .ic{color:var(--ice);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wlb{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:7px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0;white-space:nowrap;overflow:visible}
.wlb.on{background:var(--sky);color:var(--navy);font-weight:700}
.cnt{background:var(--navy);color:var(--ice);border-radius:999px;min-width:22px;padding:0 6px;font-size:.78rem;text-align:center}
.cnt.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.6)}}
.hero{text-align:center;padding:36px 18px;margin-bottom:16px}
h1{margin:0 0 10px;font-size:clamp(2rem,7vw,3.6rem);line-height:1.05;letter-spacing:-1px}
h1 span{background:linear-gradient(90deg,var(--ice),#fff,var(--sky),var(--ice));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:250% 0}}
.hero p{color:var(--muted);margin:0 auto 22px;max-width:460px}
.big{background:linear-gradient(135deg,var(--sky),var(--ice));color:var(--navy);border:0;border-radius:999px;padding:14px 30px;font-weight:800;font-size:1.05rem;transition:transform .15s}
.big:hover{transform:scale(1.06) rotate(-1deg)}
.big:active{transform:scale(.94)}
.big .ic{margin-right:8px}

.bar{padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.sw{position:relative}
.sw .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
input{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:11px 14px 11px 40px;outline:none;transition:box-shadow .2s,border-color .2s}
input:focus{border-color:var(--ice);box-shadow:0 0 0 4px rgba(99,192,228,.25)}
input::placeholder{color:var(--muted)}
.lbl{font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--ice);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem;transition:transform .15s,background .2s}
.chip:hover{transform:translateY(-2px);background:rgba(255,255,255,.18)}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--sky);color:var(--navy);border-color:var(--sky);font-weight:700;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}
.res{color:var(--muted);font-size:.85rem;margin:0 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{position:relative;overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;opacity:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}}
.card:hover{box-shadow:0 10px 24px rgba(99,192,228,.3)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.22),transparent 55%);opacity:0;transition:opacity .2s;pointer-events:none}
.card:hover::after{opacity:1}
.art{aspect-ratio:2/3;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px 10px;font-size:1.5rem;font-weight:900;color:rgba(255,255,255,.85);letter-spacing:-1px;z-index:0}
.art svg.m{position:absolute;inset:0;width:100%;height:100%;z-index:-1;fill:none;stroke:rgba(255,255,255,.75);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.art svg.m .f{fill:rgba(255,255,255,.3);stroke:none}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:0;transition:opacity .5s}
.art img.ok{opacity:1}
.art.has{color:transparent}
.art.has::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 60%,rgba(10,25,50,.85))}
.art i{position:absolute;right:8px;bottom:6px;font-style:normal;font-size:.72rem;letter-spacing:0;color:var(--ice);font-weight:600}
.bm{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(27,54,93,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:0;z-index:2;transition:transform .2s}
.bm:hover{transform:scale(1.15)}
.bm.on{background:var(--ice);color:var(--navy)}
.bm.on .ic{fill:currentColor;animation:pop .4s}
.card h3{margin:2px 0 0;font-size:1rem;line-height:1.2}
.meta{color:var(--muted);font-size:.78rem}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.7rem;padding:2px 8px;border-radius:999px;background:rgba(159,223,240,.18);border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:34px;grid-column:1/-1}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.dot{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:99}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(10,25,50,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:440px;max-height:100%;overflow-y:auto;padding:22px;background:rgba(27,54,93,.8);animation:zoom .4s cubic-bezier(.2,1.2,.3,1)}
@keyframes zoom{from{transform:scale(.7) translateY(30px);opacity:0}}
.x{position:absolute;top:30px;right:30px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(27,54,93,.85);display:grid;place-items:center;padding:0}
.sheet .art{width:200px;max-width:100%;margin:0 auto 14px;font-size:2.2rem}
.sheet h2{margin:0 0 4px}
.sheet p{color:var(--text);opacity:.92;margin:10px 0 16px}
.shuf{animation:glitch .15s infinite}
@keyframes glitch{25%{transform:translateX(-3px);filter:hue-rotate(40deg)}75%{transform:translateX(3px)}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:999px;padding:10px 18px;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.12)}
.btn.main{background:linear-gradient(135deg,var(--sky),var(--ice));color:var(--navy);border:0}
.btn:active{transform:scale(.94)}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
[hidden]{display:none!important}
.sk{aspect-ratio:2/3;border-radius:20px;background:rgba(255,255,255,.1);animation:skp 1.2s ease-in-out infinite}
@keyframes skp{50%{opacity:.4}}
@media (min-width:700px){main{padding:30px 24px 60px}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.hero{padding:56px 24px}.bar{padding:18px}.sheet{max-width:520px}}
@media (min-width:1100px){main{max-width:1240px}.grid{grid-template-columns:repeat(5,1fr)}}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:8px}.card h3{font-size:.88rem}.art{font-size:1.2rem}.tag{font-size:.64rem}.bm{top:14px;right:14px;width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.card{opacity:1}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2l2.2 6.8H21l-5.6 4.1 2.1 6.8L12 15.6 6.5 19.7l2.1-6.8L3 8.8h6.8z"/></symbol>
<symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
<symbol id="i-bm" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main>
<nav class="glass blur">
<div class="logo"><svg class="ic"><use href="#i-spark"/></svg>NEXTWATCH</div>
<button class="wlb" id="wlb" aria-pressed="false"><svg class="ic"><use href="#i-bm"/></svg>Watchlist<span class="cnt" id="cnt">0</span></button>
</nav>
<header class="hero glass blur">
<h1>Find your next <span>obsession</span></h1>
<p>Pick a mood or a genre, or let fate choose your next anime.</p>
<button class="big" id="rand"><svg class="ic"><use href="#i-dice"/></svg>Surprise me</button>
</header>
<section class="bar glass blur">
<div class="sw"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search anime…" aria-label="Search anime"></div>
<div><div class="lbl">Mood</div><div class="chips" id="moods"></div></div>
<div><div class="lbl">Genre</div><div class="chips" id="genres"></div></div>
<div><div class="lbl">Sort by</div><div class="chips" id="sorts"></div></div>
</section>
<div class="res" id="res"></div>
<section class="grid" id="grid"></section>
<div id="sent"></div>
<div style="text-align:center;margin-top:18px"><button class="btn main" id="more" hidden>Load more</button></div>
<footer>NextWatch · made for anime lovers · posters from AniList</footer>
</main>
<div id="modal" role="dialog" aria-modal="true"><div class="sheet glass blur" id="sheet"></div></div>
<script>
const MOODS={hype:{n:"Hype me up",g:"Action"},cry:{n:"Make me cry",t:["Tragedy"]},chill:{n:"Chill vibes",t:["Iyashikei","Rural"]},mind:{n:"Mind-bending",t:["Psychological","Time Manipulation","Philosophy"]},laugh:{n:"Laugh out loud",g:"Comedy"},love:{n:"Feel the love",g:"Romance"}};
const GEN=["Action","Adventure","Comedy","Drama","Fantasy","Horror","Isekai","Mecha","Music","Mystery","Psychological","Romance","Sci-Fi","Slice of Life","Sports","Supernatural","Thriller"];
const SORTS={POPULARITY_DESC:"Popular",SCORE_DESC:"Top rated",TRENDING_DESC:"Trending",START_DATE_DESC:"Newest"};
const MO={Action:'<path class="f" d="M60 4L42 32h14L46 56 78 22H62z"/><path d="M10 50L40 10M20 56L50 16"/>',Adventure:'<path class="f" d="M0 56L28 20l14 18 16-26 42 44z"/><circle cx="78" cy="14" r="7"/>',Comedy:'<circle class="f" cx="70" cy="30" r="22"/><path d="M60 24v4M80 24v4M60 36q10 10 20 0"/>',Drama:'<path class="f" d="M70 8a22 22 0 1 0 14 38A18 18 0 0 1 70 8z"/><path d="M20 18q-6 10 0 14q6-4 0-14z"/>',Fantasy:'<path class="f" d="M52 56V32h8v-8h6v8h8v-8h6v8h8V56z"/><path d="M24 12l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>',Mystery:'<circle cx="62" cy="26" r="16"/><path d="M74 38l16 16M54 26a8 8 0 0 1 8-8"/>',Romance:'<path class="f" d="M70 54L42 28A14 14 0 0 1 70 14A14 14 0 0 1 98 28Z"/>',"Sci-Fi":'<circle class="f" cx="68" cy="30" r="14"/><ellipse cx="68" cy="30" rx="32" ry="8" transform="rotate(-20 68 30)"/>',"Slice of Life":'<circle class="f" cx="70" cy="30" r="12"/><path d="M70 6v6M70 48v6M46 30h6M88 30h6M53 13l4 4M83 43l4 4M87 13l-4 4M57 43l-4 4"/>',Sports:'<circle class="f" cx="68" cy="30" r="22"/><path d="M46 30h44M68 8v44M52 14q16 16 0 32M84 14q-16 16 0 32"/>',Thriller:'<path d="M44 30q24-24 48 0q-24 24-48 0z"/><circle class="f" cx="68" cy="30" r="8"/>',Music:'<path d="M44 44V16l30-6v28"/><circle class="f" cx="38" cy="46" r="7"/><circle class="f" cx="68" cy="40" r="7"/>'};
const AL={Horror:"Thriller",Mecha:"Sci-Fi",Supernatural:"Fantasy",Psychological:"Mystery","Mahou Shoujo":"Fantasy"};
const $=id=>document.getElementById(id);
let sel={k:"",v:""},sort="POPULARITY_DESC",q="",page=0,hasNext=false,items=[],rq=0,onlyWL=false,busy=false;
const byId=new Map();
let WL={};try{WL=JSON.parse(localStorage.getItem("nw_wl2")||"{}")||{}}catch(e){}
Object.values(WL).forEach(a=>byId.set(a.id,a));
const save=()=>{try{localStorage.setItem("nw_wl2",JSON.stringify(WL))}catch(e){}};
const ico=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const artStyle=i=>`background:radial-gradient(circle at ${(i*37)%100}% ${(i*61)%100}%,rgba(159,223,240,.95),transparent 55%),linear-gradient(${(i*47)%360}deg,#055699,#1b365d)`;
const ini=t=>t.split(/[\s:]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("");
const im=a=>`<img src="${a.img}" alt="" loading="lazy" referrerpolicy="no-referrer" onload="this.classList.add('ok');this.parentNode.classList.add('has')" onerror="this.remove()">`;
const art=a=>`<div class="art" style="${artStyle(a.id)}"><svg class="m" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice">${MO[a.g[0]]||MO[AL[a.g[0]]]||MO.Fantasy}</svg>${a.img?im(a):""}${ini(a.t)}<i>${a.y}</i></div>`;
const card=(a,i)=>`<article class="card glass" data-id="${a.id}" style="animation-delay:${Math.min(i,14)*45}ms">${art(a)}<button class="bm${WL[a.id]?" on":""}" aria-label="Toggle watchlist">${ico("bm")}</button><h3>${a.t}</h3><div class="meta">${a.m}${a.y?" · "+a.y:""}</div><div class="tags">${a.g.slice(0,2).map(x=>`<span class="tag">${x}</span>`).join("")}</div></article>`;
const skel=()=>'<div class="sk"></div>'.repeat(10);
function norm(m){let d=(m.description||"").replace(/~!.*?!~/gs,"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();if(d.length>260)d=d.slice(0,260).replace(/\s\S*$/,"")+"…";
return{id:m.id,t:m.title.english||m.title.romaji,y:m.seasonYear||"",m:m.format==="MOVIE"?"Movie":m.format==="ONA"?"ONA":"Series",g:m.genres||[],d,img:(m.coverImage&&m.coverImage.large)||"",s:m.averageScore||0}}
function args(p,o){
let a=`type:ANIME,isAdult:false,format_in:[TV,MOVIE,ONA],status_not:NOT_YET_RELEASED,genre_not_in:["Hentai","Ecchi"],sort:[${o.sort}]`;
if(o.search)a+=`,search:${JSON.stringify(o.search)}`;
const f=o.sel;
if(f.k==="mood"){const m=MOODS[f.v];if(m.g)a+=`,genre:${JSON.stringify(m.g)}`;if(m.t)a+=`,tag_in:${JSON.stringify(m.t)}`}
if(f.k==="genre"){if(f.v==="Isekai")a+=`,tag_in:["Isekai"]`;else a+=`,genre:${JSON.stringify(f.v)}`}
return `{Page(page:${p},perPage:24){pageInfo{hasNextPage}media(${a}){id title{english romaji}seasonYear format genres description(asHtml:false)coverImage{large}averageScore}}}`}
async function gql(query){const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query})});const j=await r.json();if(!j.data)throw new Error("api");return j.data}
function chips(){
$("moods").innerHTML=Object.entries(MOODS).map(([k,m])=>`<button class="chip${sel.k==="mood"&&sel.v===k?" on":""}" data-m="${k}">${m.n}</button>`).join("");
$("genres").innerHTML=GEN.map(g=>`<button class="chip${sel.k==="genre"&&sel.v===g?" on":""}" data-g="${g}">${g}</button>`).join("");
$("sorts").innerHTML=Object.entries(SORTS).map(([k,v])=>`<button class="chip${sort===k?" on":""}" data-s="${k}">${v}</button>`).join("");
}
function fail(){$("res").textContent="";$("more").hidden=true;$("grid").innerHTML='<div class="empty glass">Couldn’t reach AniList. Check your connection and try again.<br><br><button class="btn main" id="retry">Retry</button></div>'}
function draw(fresh,start,reset){
$("res").textContent=items.length+(hasNext?"+":"")+" anime";
$("more").hidden=!hasNext;
if(!items.length){$("grid").innerHTML='<div class="empty glass">Nothing found. Try another mood, genre or search.</div>';return}
const h=fresh.map((a,i)=>card(a,i)).join("");
if(reset)$("grid").innerHTML=h;else $("grid").insertAdjacentHTML("beforeend",h);
}
async function load(reset){
if(onlyWL)return;
const my=++rq;
if(reset){page=0;items=[];hasNext=false;$("grid").innerHTML=skel();$("more").hidden=true;$("res").textContent="Loading…"}
busy=true;
try{
const d=await gql(args(page+1,{search:q,sel,sort:q?"SEARCH_MATCH":sort}));
if(my!==rq)return;
page++;hasNext=d.Page.pageInfo.hasNextPage;
const fresh=d.Page.media.map(norm);fresh.forEach(a=>byId.set(a.id,a));
const start=items.length;items=items.concat(fresh);
draw(fresh,start,reset);
}catch(e){if(my===rq)fail()}
finally{if(my===rq)busy=false}
}
function showWL(){rq++;items=Object.values(WL);hasNext=false;$("more").hidden=true;$("res").textContent=items.length+" saved";
$("grid").innerHTML=items.length?items.map((a,i)=>card(a,i)).join(""):'<div class="empty glass">Nothing saved yet. Tap the bookmark on any anime.</div>'}
function setWL(v){onlyWL=v;$("wlb").classList.toggle("on",v);$("wlb").setAttribute("aria-pressed",v);v?showWL():load(true)}
function refilter(){if(onlyWL){onlyWL=false;$("wlb").classList.remove("on");$("wlb").setAttribute("aria-pressed",false)}chips();load(true)}
function burst(x,y){
const c=["#9fdff0","#63c0e4","#ffffff","#055699"];
for(let i=0;i<10;i++){
const d=document.createElement("div");d.className="dot";d.style.left=x+"px";d.style.top=y+"px";d.style.background=c[i%4];
document.body.appendChild(d);
const a=Math.PI*2*i/10,r=40+Math.random()*60;
d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(0)`,opacity:0}],{duration:650+Math.random()*250,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>d.remove();
}}
function toggle(id){
const a=byId.get(id);if(!a)return;
WL[id]?delete WL[id]:WL[id]=a;save();
const c=$("cnt");c.textContent=Object.keys(WL).length;c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
}
function detail(a){
const on=!!WL[a.id];
$("sheet").innerHTML=`<button class="x" id="cl" aria-label="Close">${ico("x")}</button>${art(a)}<h2>${a.t}</h2><div class="meta">${a.m}${a.y?" · "+a.y:""}${a.s?" · Score "+a.s:""}</div><p>${a.d||"No description available."}</p><div class="tags" style="margin-bottom:16px">${a.g.map(x=>`<span class="tag">${x}</span>`).join("")}</div><div class="row"><button class="btn main" id="sv" data-id="${a.id}">${ico("bm")} ${on?"Saved":"Add to watchlist"}</button><button class="btn" id="again">${ico("dice")} Another</button></div>`;
}
function close(){$("modal").classList.remove("show")}
async function surprise(){
$("modal").classList.add("show");
$("sheet").innerHTML=`<div class="art shuf" style="${artStyle(0)}">?</div><h2 class="shuf" id="sh">Rolling…</h2>`;
const pool=items.length?items:[{t:"…"}];
const iv=setInterval(()=>{const h=$("sh");if(h)h.textContent=pool[Math.floor(Math.random()*pool.length)].t},75);
let pick=null;
try{
const o={search:"",sel,sort:"POPULARITY_DESC"};
const wait=new Promise(r=>setTimeout(r,900));
let d=await gql(args(1+Math.floor(Math.random()*8),o));
let L=d.Page.media.map(norm);
if(!L.length){d=await gql(args(1,o));L=d.Page.media.map(norm)}
await wait;
L.forEach(a=>byId.set(a.id,a));
pick=L[Math.floor(Math.random()*L.length)];
}catch(e){}
clearInterval(iv);
if(!pick&&items.length)pick=items[Math.floor(Math.random()*items.length)];
if(!pick){close();return}
detail(pick);burst(innerWidth/2,innerHeight/2);
}
document.addEventListener("pointerdown",e=>{
const b=e.target.closest("button,.card");
if(b){const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/2,p=document.createElement("span");p.className="ripple";p.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;if(getComputedStyle(b).position==="static")b.style.position="relative";b.appendChild(p);setTimeout(()=>p.remove(),650);burst(e.clientX,e.clientY)}
});
document.querySelector(".bar").addEventListener("click",e=>{
const t=e.target.closest(".chip");if(!t)return;
const d=t.dataset;
if(d.m)sel=sel.k==="mood"&&sel.v===d.m?{k:"",v:""}:{k:"mood",v:d.m};
else if(d.g)sel=sel.k==="genre"&&sel.v===d.g?{k:"",v:""}:{k:"genre",v:d.g};
else if(d.s)sort=d.s;
refilter();
});
let tm;
$("q").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{q=e.target.value.trim();refilter()},450)});
$("wlb").addEventListener("click",()=>setWL(!onlyWL));
$("rand").addEventListener("click",surprise);
$("more").addEventListener("click",()=>{if(hasNext&&!busy)load(false)});
new IntersectionObserver(es=>{if(es[0].isIntersecting&&hasNext&&!busy&&!onlyWL&&items.length)load(false)},{rootMargin:"500px"}).observe($("sent"));
$("grid").addEventListener("click",e=>{
if(e.target.closest("#retry"))return load(true);
const c=e.target.closest(".card");if(!c)return;
const id=+c.dataset.id;
if(e.target.closest(".bm")){toggle(id);if(onlyWL)showWL();else e.target.closest(".bm").classList.toggle("on",!!WL[id]);return}
const a=byId.get(id);if(a){detail(a);$("modal").classList.add("show")}
});
let tk=0;
$("grid").addEventListener("pointermove",e=>{
if(e.pointerType!=="mouse"||tk)return;tk=1;requestAnimationFrame(()=>tk=0);
const c=e.target.closest(".card");if(!c)return;
const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
c.style.setProperty("--ry",((px-.5)*14)+"deg");c.style.setProperty("--rx",((.5-py)*14)+"deg");
c.style.setProperty("--gx",px*100+"%");c.style.setProperty("--gy",py*100+"%");
});
$("grid").addEventListener("pointerout",e=>{const c=e.target.closest(".card");if(c){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
$("modal").addEventListener("click",e=>{
if(e.target.id==="modal"||e.target.closest("#cl"))return close();
const sv=e.target.closest("#sv");
if(sv){const id=+sv.dataset.id;toggle(id);sv.innerHTML=ico("bm")+" "+(WL[id]?"Saved":"Add to watchlist");
const bm=document.querySelector('.card[data-id="'+id+'"] .bm');if(bm)bm.classList.toggle("on",!!WL[id]);if(onlyWL)showWL()}
if(e.target.closest("#again"))surprise();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("cnt").textContent=Object.keys(WL).length;
chips();load(true);
</script>
</body>
</html>
